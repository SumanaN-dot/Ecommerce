services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: local-password
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shop:local-password@db:5432/shop
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  pgdata:
