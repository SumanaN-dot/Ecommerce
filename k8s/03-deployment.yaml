apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      serviceAccountName: ecommerce-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: REGION-docker.pkg.dev/PROJECT_ID/ecommerce/app:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom: {configMapKeyRef: {name: ecommerce-config, key: DB_HOST}}
            - name: DB_PORT
              valueFrom: {configMapKeyRef: {name: ecommerce-config, key: DB_PORT}}
            - name: DB_NAME
              valueFrom: {configMapKeyRef: {name: ecommerce-config, key: DB_NAME}}
            - name: DB_USER
              valueFrom: {configMapKeyRef: {name: ecommerce-config, key: DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ecommerce-secrets, key: DB_PASSWORD}}
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "512Mi"}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "--port=5432"
            - "PROJECT_ID:REGION:SQL_INSTANCE"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
