apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  DB_HOST: "127.0.0.1"
  DB_PORT: "5432"
  DB_NAME: "shop"
  DB_USER: "shop"
---
# Demo only. For production, create this Secret from Secret Manager/CI rather
# than committing a real password to Git.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME"
