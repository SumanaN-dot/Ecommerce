<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2dcc7"/>
      <stop offset="1" stop-color="#cfc9b0"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b684e"/>
      <stop offset="1" stop-color="#39442f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#wall)"/>
  <circle cx="240" cy="210" r="150" fill="#efe8d2" opacity=".6" filter="url(#soft)"/>

  <!-- workbench -->
  <rect y="620" width="900" height="280" fill="#c2b596"/>
  <rect y="620" width="900" height="12" fill="#ab9e7f"/>
  <ellipse cx="450" cy="660" rx="260" ry="34" fill="#7f7357" opacity=".5" filter="url(#soft)"/>

  <!-- pottery wheel plate -->
  <ellipse cx="450" cy="640" rx="230" ry="34" fill="#a89a78"/>
  <ellipse cx="450" cy="632" rx="230" ry="30" fill="#bcae8b"/>

  <!-- bowl being shaped -->
  <path d="M310 520 q0 -30 30 -30 h220 q30 0 30 30 q0 100 -140 100 q-140 0 -140 -100 z" fill="url(#clay)"/>
  <ellipse cx="450" cy="492" rx="140" ry="26" fill="#2e3826"/>
  <ellipse cx="450" cy="492" rx="112" ry="18" fill="#4c5940"/>
  <path d="M330 520 q-10 50 20 78" stroke="#7d8b66" stroke-width="12" fill="none" opacity=".6" stroke-linecap="round"/>

  <!-- tools -->
  <g transform="translate(690 596) rotate(-14)">
    <rect x="0" y="0" width="120" height="14" rx="7" fill="#b0946c"/>
    <rect x="96" y="-6" width="34" height="26" rx="8" fill="#5e6b4c"/>
  </g>
  <ellipse cx="200" cy="612" rx="46" ry="14" fill="#b0946c"/>
  <ellipse cx="200" cy="606" rx="46" ry="12" fill="#c9ad83"/>

  <!-- hanging plant sprig top right -->
  <g stroke="#5c6b48" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M840 0 q-30 110 -110 160"/>
  </g>
  <g fill="#71805a">
    <ellipse cx="806" cy="70" rx="11" ry="24" transform="rotate(30 806 70)"/>
    <ellipse cx="776" cy="118" rx="11" ry="24" transform="rotate(45 776 118)"/>
    <ellipse cx="742" cy="150" rx="11" ry="22" transform="rotate(60 742 150)"/>
  </g>
</svg>
