<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <meta
    name="description"
    content="Shop the full Nimbus collection"
  />

  <title>Nimbus — Shop All</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="announcement">
    Free shipping on orders over $75
    <span>·</span>
    30-day returns
  </div>

  <header class="nav shell">
    <a class="brand" href="/">NIMBUS</a>

    <nav aria-label="Primary navigation">
      <a href="/#new">New</a>
      <a href="/shop.html" aria-current="page">Shop</a>
      <a href="/#story">Our story</a>
    </nav>

    <div class="nav-actions">
      <a
        class="account-link"
        id="accountLink"
        href="/auth.html"
      >
        Log in
      </a>

      <button
        class="icon-button"
        type="button"
        aria-label="Search"
      >
        ⌕
      </button>

      <button
        class="cart-button"
        id="cartButton"
        type="button"
        aria-label="Open cart"
      >
        Bag
        <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-header shell">
      <p class="eyebrow">THE FULL COLLECTION</p>
      <h1>Shop all</h1>
      <p class="page-header-text">
        Every Nimbus piece, made in small batches with
        honest materials.
      </p>
    </section>

    <section
      class="products shell shop-page"
      aria-label="All products"
    >
      <div
        class="product-grid"
        id="productGrid"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <aside
    class="cart-drawer"
    id="cartDrawer"
    aria-hidden="true"
    aria-label="Shopping cart"
  >
    <div class="cart-header">
      <h2>Your bag</h2>

      <button
        id="closeCart"
        type="button"
        aria-label="Close cart"
      >
        ×
      </button>
    </div>

    <div
      id="cartItems"
      class="cart-items"
      aria-live="polite"
    >
      <p class="empty">Your bag is empty.</p>
    </div>

    <div class="cart-footer">
      <div>
        <span>Subtotal</span>
        <strong id="subtotal">$0.00</strong>
      </div>

      <button
        id="checkoutButton"
        type="button"
      >
        Checkout
      </button>
    </div>
  </aside>

  <div
    class="overlay"
    id="overlay"
    aria-hidden="true"
  ></div>

  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script src="/app.js"></script>
</body>
</html>
