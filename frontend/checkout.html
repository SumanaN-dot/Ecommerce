<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nimbus — Checkout</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><header class="checkout-nav shell"><a class="brand" href="/">NIMBUS</a><div><span id="checkoutUser"></span><button id="logoutButton">Log out</button></div></header><main class="checkout-layout shell"><section><p class="eyebrow">YOUR ORDER</p><h1 class="checkout-title">Checkout</h1><div id="checkoutItems"></div></section><section class="checkout-card"><form id="checkoutForm" class="checkout-form"><h2>Shipping information</h2><label>Full name<input id="customerName" required></label><label>Email<input id="customerEmail" type="email" required></label><label>Address<input id="addressLine1" required></label><label>Apartment or suite<input id="addressLine2"></label><div class="form-grid"><label>City<input id="city" required></label><label>State<input id="state" required></label></div><div class="form-grid"><label>ZIP code<input id="postalCode" required></label><label>Country<input id="country" value="United States" required></label></div><div class="checkout-summary"><div><span>Subtotal</span><strong id="checkoutSubtotal">$0.00</strong></div></div><p class="checkout-note">Demo checkout only. No card details are collected.</p><button id="placeOrderButton" class="primary-button">Place order</button><p id="checkoutMessage" class="form-message"></p></form></section></main><script src="/checkout.js"></script></body></html>
