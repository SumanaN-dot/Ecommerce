<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nimbus — Account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-page"><section class="auth-visual"><a class="brand" href="/">NIMBUS</a><div><p class="eyebrow">YOUR NIMBUS ACCOUNT</p><h1>Keep your cart, wherever you go.</h1></div></section><section class="auth-panel"><div class="auth-card"><div class="auth-tabs"><button id="loginTab" class="active">Log in</button><button id="signupTab">Sign up</button></div><form id="loginForm" class="auth-form"><h2>Log in</h2><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" required></label><button class="primary-button">Log in</button></form><form id="signupForm" class="auth-form hidden"><h2>Create account</h2><label>Full name<input id="signupName" required></label><label>Email<input id="signupEmail" type="email" required></label><label>Password<input id="signupPassword" type="password" minlength="8" required></label><button class="primary-button">Create account</button></form><div class="test-user-box"><button data-email="user1@example.com" data-password="UserOne123!">Use User 1</button><button data-email="user2@example.com" data-password="UserTwo123!">Use User 2</button></div><p id="authMessage" class="form-message"></p></div></section></main><script src="/auth.js"></script></body></html>
